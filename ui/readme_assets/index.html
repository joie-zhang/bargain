<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment launch guide</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to guide</a>
  <aside>
    <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true">b.</span><span>Bargain<small>Experiment launch guide</small></span></a>
    <label for="search">Find a section or command</label>
    <input id="search" type="search" placeholder="Search the guide…" autocomplete="off">
    <nav id="nav" aria-label="Guide sections"></nav>
    <div class="sidebar-note"><span class="status-dot" aria-hidden="true"></span>Read-only viewer<p>Copy commands to your terminal.<br>Nothing runs from this page.</p></div>
  </aside>
  <div class="workspace" id="top">
    <header><span class="breadcrumb">Documentation <span aria-hidden="true">/</span> README2.md</span><div class="tools"><button id="refresh">Refresh</button><a class="button" href="/download">Download Markdown</a></div></header>
    <main id="main" tabindex="-1">
      <div class="eyebrow">Run the experiments</div>
      <div id="document" aria-busy="true"><p>Loading the guide…</p></div>
      <p id="empty" hidden>No sections match your search.</p>
      <p id="error" role="alert" hidden></p>
      <footer><p id="source"></p><p id="updated"></p></footer>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
