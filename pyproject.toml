[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bargain-negotiation"
version = "0.1.0"
description = "Language-model negotiation experiments"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "scipy>=1.11", "aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
analysis = ["pandas>=2", "matplotlib>=3.7", "seaborn>=0.12", "statsmodels>=0.14", "tabulate>=0.9"]

[project.scripts]
bargain = "strong_models_experiment.cli:main"

[tool.setuptools.packages.find]
include = ["strong_models_experiment*", "negotiation*", "game_environments*"]
namespaces = false

[tool.setuptools.package-data]
strong_models_experiment = ["resources/*.md", "resources/*.json"]
